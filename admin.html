<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة Automobile Elkheshen</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6fb;color:#171827}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#171331,#5d32a5)}
.card{background:#fff;border-radius:22px;box-shadow:0 20px 60px #0004;padding:32px;width:min(440px,100%)}
.logo{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 15px}.center{text-align:center}
h1{margin:5px 0 8px}.muted{color:#777;font-size:14px}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;outline:none;background:#fff}.field input:focus,.field textarea:focus{border-color:#6c43c4}
.btn{width:100%;padding:13px;border-radius:12px;background:#6037ae;color:#fff;font-weight:700}.btn.secondary{background:#eee;color:#222;margin-top:10px}.msg{margin-top:14px;text-align:center;color:#c62828;min-height:20px}
.app{display:none;min-height:100vh}.top{background:#19152c;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{background:#fff;color:#19152c;padding:9px 14px;border-radius:10px}.wrap{max-width:1200px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0000000b}.stat b{font-size:30px;display:block}.grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #0000000b}.cars{display:grid;gap:12px}.car{border:1px solid #eee;border-radius:14px;padding:12px;display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center}.car img{width:90px;height:65px;object-fit:cover;border-radius:10px;background:#eee}.actions{display:flex;gap:6px}.small{padding:8px 10px;border-radius:9px;background:#eee}.danger{background:#fee;color:#b11}.ok{background:#e8f7ee;color:#16733a}.search{margin-bottom:15px}.images{display:flex;flex-wrap:wrap;gap:8px}.thumb{position:relative}.thumb img{width:82px;height:62px;object-fit:cover;border-radius:8px}.thumb button{position:absolute;top:2px;right:2px;background:#000b;color:#fff;border-radius:50%;width:20px;height:20px}.status{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section id="login" class="login">
<div class="card">
<img class="logo" src="/assets/logo.jpg" onerror="this.style.display='none'">
<div class="center"><h1>لوحة إدارة السيارات</h1><div class="muted">Automobile Elkheshen</div></div>
<div class="field"><label>كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="current-password" placeholder="اكتب كلمة المرور"></div>
<button class="btn" id="loginBtn">دخول لوحة التحكم</button>
<button class="btn secondary" id="healthBtn">اختبار اتصال النظام</button>
<div id="msg" class="msg"></div>
</div></section>

<section id="app" class="app">
<header class="top"><div><b>Automobile Elkheshen</b><div class="muted" style="color:#ccc">إدارة السيارات والمخزون</div></div><button id="logout">تسجيل الخروج</button></header>
<main class="wrap">
<div class="stats"><div class="stat">إجمالي السيارات<b id="total">0</b></div><div class="stat">المتاحة<b id="available">0</b></div><div class="stat">المباعة<b id="sold">0</b></div></div>
<div class="grid">
<div class="panel">
<h2 id="formTitle">إضافة سيارة</h2>
<input type="hidden" id="id">
<div class="field"><label>اسم السيارة</label><input id="name" placeholder="مثال: Mercedes C180"></div>
<div class="field"><label>السعر</label><input id="price" placeholder="مثال: 250000" inputmode="decimal"></div>
<div class="field"><label>السنة</label><input id="year" placeholder="2025" inputmode="numeric"></div>
<div class="field"><label>ناقل الحركة</label><input id="transmission" placeholder="أوتوماتيك"></div>
<div class="field"><label>الوقود</label><input id="fuel" placeholder="بنزين"></div>
<div class="field"><label>الوصف</label><textarea id="description" rows="4" placeholder="وصف السيارة"></textarea></div>
<div class="field"><label>صور السيارة (يمكن اختيار أكثر من صورة)</label><input id="images" type="file" accept="image/*" multiple><div id="preview" class="images"></div></div>
<button class="btn" id="save">حفظ السيارة</button>
<button class="btn secondary" id="cancel" style="display:none">إلغاء التعديل</button>
</div>
<div class="panel">
<h2>المخزون</h2><input class="field search" id="search" placeholder="بحث باسم السيارة...">
<div id="cars" class="cars"></div>
</div>
</div></main>
</section>
<script src="/admin.js?v=20260906"></script>
</body></html>
