<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Automobile Elkheshen</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar"><div class="container topbar-inner"><span>لوحة إدارة السيارات</span><a href="/">← العودة للموقع</a></div></div><main class="cars-section"><div class="container"><div class="section-head"><div><span class="eyebrow">ADMIN PANEL</span><h2>إدارة السيارات</h2><p>أضف السيارات وعدّل بياناتها وصورها من مكان واحد.</p></div><a class="btn btn-primary" href="/">عرض الموقع</a></div><div class="modal-card" style="margin:0 auto;max-width:900px"><label>كلمة مرور الإدارة</label><input id="pass" type="password" placeholder="كلمة مرور الإدارة"><form id="productForm"><input name="id" placeholder="معرّف السيارة (اختياري)"><div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px"><input name="name" placeholder="اسم السيارة" required><input name="price" type="number" placeholder="السعر" required><input name="year" placeholder="الموديل / السنة"></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><input name="category" placeholder="التصنيف: sedan / suv / other"><input name="transmission" placeholder="ناقل الحركة"><input name="fuel" placeholder="الوقود"></div><input name="badge" placeholder="شارة السيارة (مثال: مميز / فرصة)"><select name="status"><option value="available">متاحة للبيع</option><option value="sold">مباعة</option></select><textarea name="description" placeholder="وصف السيارة والتجهيزات والحالة..."></textarea><label style="font-weight:800">صور السيارة</label><label for="imageFiles" class="btn btn-primary" style="margin-top:8px">📷 اختيار الصور من الجهاز</label><input id="imageFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple style="display:none"><p id="uploadStatus" style="font-size:11px;color:#777"></p><div id="imagePreview" style="display:flex;flex-wrap:wrap;gap:8px;margin:10px 0"></div><textarea name="images" placeholder="روابط الصور المرفوعة ستظهر هنا" required></textarea><button class="btn btn-primary full">حفظ السيارة</button></form><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><div id="adminList"></div></div></div></main><script src="/admin.js"></script></body></html>
